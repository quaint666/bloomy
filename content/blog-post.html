<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The page lives at /blog/<slug>; <base> keeps every relative link and file path working from there.
       (So: no "#section" links inside a post, they would point at the home page.) -->
  <base href="/">
  <title>{{post_title}} — Bloomy</title>
  <meta name="description" content="{{post_description}}">
  <link rel="canonical" href="{{post_url}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{post_title}}">
  <meta property="og:description" content="{{post_description}}">
  <meta property="og:image" content="{{site_base}}/images/og-image.jpg">
  <meta property="og:url" content="{{post_url}}">
  <meta property="article:published_time" content="{{post_date}}">
  <link rel="icon" type="image/png" href="images/bloomylogo.png">


  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="fonts/be-vietnam-pro-v12-latin_vietnamese-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/be-vietnam-pro-v12-latin_vietnamese-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/be-vietnam-pro-v12-latin_vietnamese-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lora-v37-latin_vietnamese-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lora-v37-latin_vietnamese-500italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <!-- A thin bar across the very top that fills as the post is read (js/blog.js) -->
  <div class="reading-progress" aria-hidden="true"><div class="reading-progress__bar" id="reading-progress-bar"></div></div>

  <!--include:header-->

  <main class="container blog-page">
    <article class="blog-article">
      <p class="breadcrumb"><a href="index.html">Trang chủ</a> <span>›</span> <a href="blog">Blog</a> <span>›</span> {{post_title}}</p>
      <h1 class="blog-article__title">{{post_title}}</h1>
      <p class="blog-article__meta"><time datetime="{{post_date}}">{{post_date_display}}</time></p>
      <div class="blog-article__body">
        {{post_body}}
      </div>
    </article>

    <section class="blog-more" aria-label="Bài viết khác">
      <h2 class="blog-more__title">Bài viết khác</h2>
      <ul class="blog-list blog-list--compact">
        {{blog_more}}
      </ul>
    </section>
  </main>

  <!--include:footer-->

  <!--include:floating-contact-->

  <script src="js/main.js" defer></script>
  <script src="js/blog.js" defer></script>
</body>
</html>
